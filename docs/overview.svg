<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-label="iTime architecture, internet NTP servers through WiFi router to ESP-WROOM-32 and LCD 1602">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1b32"/><stop offset="1" stop-color="#122b39"/></linearGradient></defs>
  <rect width="980" height="300" rx="24" fill="url(#bg)"/>
  <text x="35" y="54" font-size="34" font-weight="bold" fill="#fff" font-family="Arial, sans-serif">iTime <tspan fill="#60d8ff">|</tspan> ESP32 network clock</text>
  <text x="35" y="82" font-size="16" fill="#aec7d6" font-family="Arial, sans-serif">40 MHz SPI Flash · DIO · fixed UTC+4 · LCD 16x2</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="122" width="195" height="112" rx="14" fill="#21415a" stroke="#66b4df"/>
    <text x="132" y="165" fill="#fff" font-size="22" font-weight="bold">NTP servers</text>
    <text x="132" y="194" fill="#bfdeef" font-size="15">pool.ntp.org</text>
    <rect x="281" y="122" width="175" height="112" rx="14" fill="#21415a" stroke="#66b4df"/>
    <text x="369" y="166" fill="#fff" font-size="22" font-weight="bold">Wi-Fi</text>
    <text x="369" y="195" fill="#bfdeef" font-size="15">2.4 GHz</text>
    <rect x="508" y="122" width="209" height="112" rx="14" fill="#21415a" stroke="#66b4df"/>
    <text x="612" y="166" fill="#fff" font-size="21" font-weight="bold">ESP-WROOM-32</text>
    <text x="612" y="195" fill="#bfdeef" font-size="15">Arduino + SNTP</text>
    <rect x="765" y="122" width="181" height="112" rx="14" fill="#153250" stroke="#60d8ff"/>
    <text x="856" y="161" fill="#d3efff" font-size="18" font-weight="bold">31.10.2026</text>
    <text x="856" y="193" fill="#d3efff" font-size="18" font-weight="bold">00:41:38</text>
    <path d="M230 179 H280 M456 179 H507 M717 179 H764" stroke="#60d8ff" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M274 173 l6 6 -6 6 M501 173 l6 6 -6 6 M758 173 l6 6 -6 6" fill="none" stroke="#60d8ff" stroke-width="3"/>
  </g>
  <text x="35" y="274" font-size="15" fill="#9ec8d9" font-family="Arial, sans-serif">The firmware reads UTC and displays a fixed +4 hour offset; no UTC label on the LCD.</text>
</svg>